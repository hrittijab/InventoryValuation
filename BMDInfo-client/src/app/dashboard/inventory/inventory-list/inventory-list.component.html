<h2 class="mb-3">Inventory Items</h2>

<div style="margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
  <!-- Add Item -->
  <button mat-raised-button color="primary" (click)="openAddDialog()">
    Add Item
  </button>
</div>

<!-- Search Bar -->
<mat-card class="search-card">
  <div class="search-container">
    <mat-form-field appearance="fill" class="search-field">
      <mat-label>Search</mat-label>
      <input matInput #q (input)="applyFilter(q.value)" placeholder="Type to filter..." />
      <button *ngIf="q.value" matSuffix mat-icon-button aria-label="Clear" (click)="q.value=''; applyFilter('')">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>
</mat-card>

<!-- Table -->
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 table table-bordered">

  <!-- SKU -->
  <ng-container matColumnDef="sku">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> SKU </th>
    <td mat-cell *matCellDef="let item"> {{ item.sku }} </td>
  </ng-container>

  <!-- Item -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Item </th>
    <td mat-cell *matCellDef="let item"> {{ item.name }} </td>
  </ng-container>

  <!-- Location -->
  <ng-container matColumnDef="location">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Location </th>
    <td mat-cell *matCellDef="let item"> {{ item.location }} </td>
  </ng-container>

  <!-- Quantity -->
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Qty </th>
    <td mat-cell *matCellDef="let item"> {{ item.quantity }} </td>
  </ng-container>

  <!-- Unit Price -->
  <ng-container matColumnDef="unitPrice">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Price </th>
    <td mat-cell *matCellDef="let item">
      {{ item.unitPrice | currency:'BDT':'symbol':'1.2-2' }}
    </td>
  </ng-container>

  <!-- Total Value -->
  <ng-container matColumnDef="totalValue">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Total </th>
    <td mat-cell *matCellDef="let item">
      {{ item.totalValue | currency:'BDT':'symbol':'1.2-2' }}
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let item">
      <button mat-stroked-button color="primary"
              (click)="openTransferDialog({ sku: item.sku, fromLocation: item.location })">
        Transfer
      </button>
    </td>
  </ng-container>

  <!-- Header & Rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- Pagination -->
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
